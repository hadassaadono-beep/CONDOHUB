
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CONDOHUB - Reservas</title>

    <style>

        * {
            box-sizing: border-box;
        }

       body {
    font-family: Arial, sans-serif;
    margin: 0;
    color: #333;

    background-image:
       
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdQXZ2_Yo6Ic82qMTJGuswIAMKRpsLcSiActSDmAuyVgtWSiIjxVwdjjk&s=10");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

       

        header {
            background: #ffffff;
            color: #222;
            text-align: center;
            padding: 28px 20px;
            border-bottom: 1px solid #e7e7e7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0 0 7px;
            font-size: 34px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

       
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 40px auto;
        }


        .caixa {
            background: #ffffff;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 22px;
            border: 1px solid #e8e8e8;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .caixa h2 {
            margin-top: 0;
            color: #222;
        }

      

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            background: #0f0033;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background:#0f0033;
            transform: translateY(-3px);
        }

       

        .foto-espaco {
            width: 100%;
            height: 330px;
            object-fit: cover;
            display: block;
            border-radius: 20px;
            margin: 20px 0 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: 0.4s;
        }

        .foto-espaco:hover {
            transform: scale(1.015);
        }

       

        #informacoes {
            line-height: 1.6;
        }

        #informacoes h2 {
            color: #222;
            font-size: 27px;
            margin-bottom: 10px;
        }

        #informacoes h3 {
            color: #0f0033;
            margin-top:25px;
        }

        #informacoes ul {
            padding-left: 25px;
        }

        #informacoes li {
            margin: 7px 0;
        }

        

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
            margin-top: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedede;
            border-radius: 12px;
            font-size: 15px;
            background: #fafafa;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color:#0f0033;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 132, 73, 0.10);
        }

        .botao-reserva {
            width: 100%;
            background: #0f0033;
            margin-top: 10px;
            padding: 17px;
            font-size: 16px;
        }

        .botao-reserva:hover {
            background: #0f0033;
        }


        #resultado {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f0faf3;
            border: 1px solid #9bd1ac;
            border-left: 5px solid #1e8449;
            border-radius: 15px;
        }
        #resultado h2 {
            color:#0f0033;
        }
        .contatos {
            text-align: center;
            background: #0f0033;
            color: #ffffff;
            border: none;
        }

        .contatos h2 {
            color: white;
        }

        .contatos p {
            color: #cfcfcf;
        }
        @media (max-width: 850px) {

            .botoes {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 22px 15px;
            }

            header h1 {
                font-size: 28px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .caixa {
                padding: 20px;
                border-radius: 17px;
            }

            .botoes {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }

            .foto-espaco {
                height: 230px;
                border-radius: 16px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>𝙲𝙾𝙽𝙳𝙾𝙷𝚄𝙱</h1>

        <p>
            Sistema de reservas das áreas comuns
        </p>

    </header>

    <div class="container">

        <div class="caixa">

            <h2>Áreas disponíveis</h2>

            <p>
                Clique em um espaço para ver suas informações.
            </p>

            <div class="botoes">

                <button onclick="mostrarSalao()">
                    Salão de Festas
                </button>

                <button onclick="mostrarGourmet()">
                    Área Gourmet
                </button>

                <button onclick="mostrarQuadra()">
                    Quadra Esportiva
                </button>

                <button onclick="mostrarPiscina()">
                    Espaço Piscina
                </button>

            </div>

        </div>


        <!-- INFORMAÇÕES -->

        <div class="caixa">

            <div id="informacoes">

                <h2>Informações do espaço</h2>

                <p>
                    Clique em um dos espaços acima.
                </p>

            </div>

        </div>


        <!-- RESERVA -->

        <div class="caixa">

            <h2>Fazer reserva</h2>

            <form
                class="formulario"
                onsubmit="fazerReserva(event)"
            >

                <label for="nome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required
                >


                <label for="telefone">
                    Telefone:
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Digite seu telefone"
                    required
                >


                <label for="espaco">
                    Espaço:
                </label>

                <select
                    id="espaco"
                    onchange="atualizarHorarios()"
                    required
                >

                    <option value="">
                        Selecione um espaço
                    </option>

                    <option value="Salão de Festas">
                        Salão de Festas
                    </option>

                    <option value="Área Gourmet">
                        Área Gourmet
                    </option>

                    <option value="Quadra Esportiva">
                        Quadra Esportiva
                    </option>

                    <option value="Espaço Piscina">
                        Espaço Piscina
                    </option>

                </select>


                <label for="data">
                    Data da reserva:
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <label for="horario">
                    Horário:
                </label>

                <select
                    id="horario"
                    required
                >

                    <option value="">
                        Escolha primeiro o espaço
                    </option>

                </select>


                <button
                    type="submit"
                    class="botao-reserva"
                >
                     Fazer reserva
                </button>

            </form>


            <!-- RESULTADO -->

            <div id="resultado"></div>

        </div>


        <!-- CONTATOS -->

        <div class="caixa contatos">

            <h2>Contatos</h2>

            <p>Guilherme (00) 000000000</p>

            <p>Luiza (00) 000000000</p>

        </div>

    </div>


    <script>


        // FUNÇÃO PARA MOSTRAR O SALÃO

        function mostrarSalao() {

            document.getElementById("informacoes").innerHTML = `

                <h2>Salão de Festas</h2>

                <img
                    src="https://blog.vitoriahoteis.com.br/wp-content/uploads/2024/11/WhatsApp-Image-2025-03-10-at-09.18.29_8_11zon-scaled.webp"
                    alt="Salão de Festas"
                    class="foto-espaco"
                >

                <p>
                    <strong>Aluguel:</strong>
                    Todos os dias - diária.
                </p>

                <h3>O que está incluso:</h3>

                <ul>

                    <li>30 mesas (5 lugares)</li>
                    <li>150 cadeiras</li>
                    <li>Cozinha de apoio</li>
                    <li>150 talheres</li>
                    <li>150 pratos (fundo)</li>
                    <li>150 copos</li>
                    <li>150 taças</li>
                    <li>1 geladeira</li>
                    <li>1 freezer</li>
                    <li>Dois banheiros</li>
                    <li>Sistema de som</li>

                </ul>

                <p>
                    <strong>Capacidade:</strong>
                    150 pessoas.
                </p>

                <h3>Regras:</h3>

                <ul>

                    <li>Respeitar o horário reservado.</li>
                    <li>Manter o ambiente limpo e organizado.</li>
                    <li>Não ultrapassar o limite de convidados.</li>
                    <li>Evitar som em volume excessivo.</li>
                    <li>Não danificar mesas, cadeiras ou equipamentos.</li>
                    <li>O responsável pela reserva responderá pelo descumprimento das regras.</li>

                </ul>

            `;

            document.getElementById("espaco").value =
                "Salão de Festas";

            atualizarHorarios();

        }


        // FUNÇÃO PARA MOSTRAR A ÁREA GOURMET

        function mostrarGourmet() {

            document.getElementById("informacoes").innerHTML = `

                <h2>Área Gourmet</h2>

                 <img
                 
                    src="https://blog.agmar.com.br/wp-content/uploads/2019/12/g_plugdados-galeria-edificio-yora-cabecalho_shape3-2-1024x384.jpeg"
                    alt="Área Gourmet"
                    class="foto-espaco"
                >

                <p>
                    <strong>Aluguel:</strong>
                    Todos os dias.
                </p>

                <p>
                    <strong>Horários:</strong>
                    10h00-14h00 / 19h00-23h00
                </p>

                <h3>O que está incluso:</h3>

                <ul>

                    <li>Churrasqueira</li>
                    <li>Bancada de preparo</li>
                    <li>Pia</li>
                    <li>8 mesas</li>
                    <li>40 cadeiras</li>
                    <li>40 talheres</li>
                    <li>40 pratos</li>
                    <li>1 geladeira</li>
                    <li>1 freezer</li>
                    <li>2 lixeiras</li>
                    <li>Área coberta</li>

                </ul>

                <p>
                    <strong>Capacidade:</strong>
                    até 40 pessoas.
                </p>

                <h3>Regras:</h3>

                <ul>

                    <li>Manter o local limpo após o uso.</li>
                    <li>Não deixar alimentos ou bebidas no espaço.</li>
                    <li>Não ultrapassar o horário da reserva.</li>
                    <li>Danos aos equipamentos são responsabilidade do responsável pela reserva.</li>
                    <li>Respeitar o limite de pessoas permitido.</li>

                   

                </ul>
                
            `;

            document.getElementById("espaco").value =
                "Área Gourmet";

            atualizarHorarios();

        }


        // FUNÇÃO PARA MOSTRAR A QUADRA

        function mostrarQuadra() {

            document.getElementById("informacoes").innerHTML = `

                <h2>Quadra Esportiva</h2>

                <img
                    src="https://i0.wp.com/catagua.com.br/wp-content/uploads/2023/09/quadra-recreativa-no-condominio-veja-6-vantagens.jpg"
                    alt="quadra esportiva"
                    class="foto-espaco"

                <p>
                    <strong>Aluguel:</strong>
                    Apenas nos finais de semana.
                </p>

                <p>
                    <strong>Horários:</strong>
                    Matutino: 7h00-12h00
                    <br>
                    Vespertino: 13h00-18h00
                </p>

                <h3>O que está incluso:</h3>

                <ul>

                    <li>Traves de futebol</li>
                    <li>Cestas de basquete</li>
                    <li>Rede para vôlei</li>
                    <li>Iluminação</li>
                    <li>Bancos para descanso</li>
                    <li>2 vestiários/banheiros</li>
                    <li>1 bebedouro</li>

                </ul>

                <p>
                    <strong>Capacidade:</strong>
                    30 pessoas.
                </p>

                <h3>Regras:</h3>

                <ul>

                    <li>Utilizar a quadra somente durante o horário reservado.</li>
                    <li>Não comer ou beber dentro da quadra.</li>
                    <li>Manter o espaço limpo.</li>
                    <li>Não exceder o número máximo de usuários.</li>
                    <li>Comunicar qualquer dano à administração.</li>

                </ul>

            `;

            document.getElementById("espaco").value =
                "Quadra Esportiva";

            atualizarHorarios();

        }


        // FUNÇÃO PARA MOSTRAR A PISCINA

        function mostrarPiscina() {

            document.getElementById("informacoes").innerHTML = `

                <h2>Espaço Piscina</h2>

                <img
                    src="https://www.hotelacademy.com.br/wp-content/uploads/2026/07/pacotes-de-ferias-para-hotel-.webp"
                    alt="Salão de Festas"
                    class="foto-espaco"

                <p>
                    <strong>Aluguel:</strong>
                    Apenas nos finais de semana.
                </p>

                <p>
                    <strong>Horários:</strong>
                    10h00-14h00 / 15h00-19h00
                </p>

                <h3>O que está incluso:</h3>

                <ul>

                    <li>Piscina adulto</li>
                    <li>Piscina infantil</li>
                    <li>8 espreguiçadeiras</li>
                    <li>6 mesas (4 lugares)</li>
                    <li>24 cadeiras</li>
                    <li>Duchas</li>
                    <li>Iluminação</li>
                    <li>2 banheiros</li>

                </ul>

                <p>
                    <strong>Capacidade:</strong>
                    30 pessoas.
                </p>

                <h3>Regras:</h3>

                <ul>

                    <li>Não jogar nada inapropriado na piscina.</li>
                    <li>Não correr ou empurrar outras pessoas.</li>
                    <li>Crianças devem estar acompanhadas por um responsável.</li>
                    <li>Não levar objetos de vidro para a área da piscina.</li>
                    <li>Não consumir alimentos dentro da piscina.</li>
                    <li>Respeitar o horário de funcionamento.</li>
                    <li>Manter a área limpa.</li>

                </ul>

            `;

            document.getElementById("espaco").value =
                "Espaço Piscina";

            atualizarHorarios();

        }


        // ATUALIZAR OS HORÁRIOS

        function atualizarHorarios() {

            let espaco =
                document.getElementById("espaco").value;

            let horario =
                document.getElementById("horario");

            horario.innerHTML = "";


            if (espaco === "Salão de Festas") {

                horario.innerHTML = `
                    <option value="Diária">
                        Diária
                    </option>
                `;

            }


            else if (espaco === "Área Gourmet") {

                horario.innerHTML = `
                    <option value="10h00-14h00">
                        10h00-14h00
                    </option>

                    <option value="19h00-23h00">
                        19h00-23h00
                    </option>
                `;

            }


            else if (espaco === "Quadra Esportiva") {

                horario.innerHTML = `
                    <option value="7h00-12h00">
                        Matutino - 7h00-12h00
                    </option>

                    <option value="13h00-18h00">
                        Vespertino - 13h00-18h00
                    </option>
                `;

            }


            else if (espaco === "Espaço Piscina") {

                horario.innerHTML = `
                    <option value="10h00-14h00">
                        10h00-14h00
                    </option>

                    <option value="15h00-19h00">
                        15h00-19h00
                    </option>
                `;

            }


            else {

                horario.innerHTML = `
                    <option value="">
                        Escolha primeiro o espaço
                    </option>
                `;

            }

        }


        // FAZER A RESERVA

        function fazerReserva(event) {

            event.preventDefault();


            let nome =
                document.getElementById("nome").value;

            let telefone =
                document.getElementById("telefone").value;

            let espaco =
                document.getElementById("espaco").value;

            let data =
                document.getElementById("data").value;

            let horario =
                document.getElementById("horario").value;


            if (
                nome === "" ||
                telefone === "" ||
                espaco === "" ||
                data === "" ||
                horario === ""
            ) {

                alert("Preencha todos os campos!");

                return;

            }


            let dataFormatada =
                data.split("-").reverse().join("/");


            let resultado =
                document.getElementById("resultado");


            resultado.style.display = "block";


            resultado.innerHTML = `

                <h2> Reserva registrada!</h2>

                <p>
                    <strong>Nome:</strong>
                    ${nome}
                </p>

                <p>
                    <strong>Telefone:</strong>
                    ${telefone}
                </p>

                <p>
                    <strong>Espaço:</strong>
                    ${espaco}
                </p>

                <p>
                    <strong>Data:</strong>
                    ${dataFormatada}
                </p>

                <p>
                    <strong>Horário:</strong>
                    ${horario}
                </p>

                <hr>

                <p>
                    Sua solicitação de reserva foi registrada
                    no sistema.
                </p>

            `;

        }

    </script>

</body>

</html>
